[package]
name = "rust-code"
version = "0.1.0"
edition = "2024"
description = "An extensible agentic CLI tool for testing LLM capabilities"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "signal"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
glob = "0.3"
regex = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
rstest = "0.25"
insta = { version = "1", features = ["json"] }
assert_cmd = "2"
predicates = "3"

# Clippy lint configuration
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Pedantic level - strict but reasonable
pedantic = { level = "warn", priority = -1 }

# Specific lints we want to enforce
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

# Pedantic lints we're relaxing
module_name_repetitions = "allow"  # Allows ToolError in tools module, etc.
must_use_candidate = "allow"       # Too noisy for iterative development
missing_errors_doc = "allow"       # We'll add docs later
missing_panics_doc = "allow"       # We'll add docs later
unused_async = "allow"             # Placeholder functions will gain async ops
