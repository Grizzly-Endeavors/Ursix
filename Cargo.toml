[package]
name = "rust-code"
version = "0.1.0"
edition = "2024"
description = "An extensible agentic CLI tool for testing LLM capabilities"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "signal"] }

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
glob = "0.3"
regex = "1"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Interactive mode
rustyline = "15"

# TUI
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
rstest = "0.26"
insta = { version = "1", features = ["json"] }
assert_cmd = "2"
predicates = "3"

# Lint configuration
[lints.rust]
unsafe_code = "forbid"
# TODO: Remove once scaffolding is wired up
dead_code = "allow"

[lints.clippy]
# Pedantic level - strict but reasonable
pedantic = { level = "warn", priority = -1 }

# Enforce proper error handling - no shortcuts
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Prevent incomplete code from being committed
todo = "deny"
unimplemented = "deny"

# Force documentation of error/panic behavior
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Force explicit return value handling
must_use_candidate = "warn"

# Keep relaxed (stylistic or architecture-specific)
module_name_repetitions = "allow"  # Allows ToolError in tools module, etc.
unused_async = "allow"             # Architecture is async by design
