# Ursix semantic linting rules
# Copy to .ursix/rules.yml in your project or ~/.config/ursix/rules.yml for global rules
#
# Unlike traditional linters that check syntax, these rules are instructions
# the LLM understands and applies contextually.

categories:
  security:
    - name: no-hardcoded-secrets
      description: "Never hardcode API keys, passwords, tokens, or secrets. Flag any string literals that look like credentials."
      severity: error

    - name: no-sql-injection
      description: "SQL queries must use parameterized queries or prepared statements. Flag string concatenation in SQL."
      severity: error

    - name: no-command-injection
      description: "Shell commands must not include unsanitized user input. Flag subprocess calls with interpolated strings."
      severity: error

  error-handling:
    - name: no-silent-failures
      description: "Errors must be logged, returned, or explicitly handled. Flag empty catch blocks and ignored Result values."
      severity: error

    - name: no-unwrap-in-handlers
      description: "HTTP/API handlers must use proper error handling, not .unwrap() or .expect(). These cause panics in production."
      severity: error
      files: "**/handlers/*.rs"

  style:
    - name: why-not-what-comments
      description: "Comments should explain WHY, not WHAT. The code shows what it does; comments should explain non-obvious reasoning. Flag comments that restate the code."
      severity: warning

    - name: no-magic-numbers
      description: "Numeric literals should be named constants if their meaning isn't obvious from context. Flag unexplained numbers in logic."
      severity: warning

  performance:
    - name: no-n-plus-one
      description: "Database queries inside loops cause N+1 problems. Flag patterns that query the database for each item in a collection."
      severity: warning

    - name: prefer-batch-operations
      description: "When processing multiple items, prefer batch/bulk operations over individual calls. Flag loops that could be batched."
      severity: warning
