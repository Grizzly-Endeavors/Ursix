# Ursix semantic linting rules
# These rules are natural language instructions the LLM applies contextually during code review.
# Derived from CLAUDE.md style guide and codebase patterns.
#
# IMPORTANT: Rules are applied per-file without cross-file context. Rules should focus on
# patterns detectable within a single file. Avoid flagging issues that require seeing
# how code is used elsewhere (e.g., don't flag error conversions without seeing error creation sites).

categories:
  error-handling:
    - name: contextual-error-messages
      description: "Error messages created with anyhow::anyhow!(), thiserror, or string literals must include context (file paths, operation names, values). Flag only the ERROR CREATION site - messages like anyhow::anyhow!(\"parse error\") or LlmError::Parse(\"invalid\".into()). Do NOT flag error conversion/mapping code that transforms existing errors."
      severity: error
      files: "*.rs"

    - name: no-silent-failures
      description: "Every failure must be visible to the user. Flag empty catch blocks, ignored Result values (let _ = fallible()), or match arms that silently swallow errors. Debug/trace logging alone is NOT sufficient."
      severity: error
      files: "*.rs"

    - name: retryability-classification
      description: "is_retryable() methods should have doc comments explaining the reasoning for each match arm. Flag undocumented retryability logic."
      severity: warning
      files: "src/llm/**/*.rs"

  output-guarantees:
    - name: structural-json-output
      description: "Structs with #[derive(Serialize)] that represent command output must have all fields serializable. Flag Option types without #[serde(skip_serializing_if)] if they should be omitted when None."
      severity: error
      files: "src/output/**/*.rs"

  logging:
    - name: structured-logging-fields
      description: "All tracing macros (info!, warn!, error!, debug!, trace!) must use structured fields (key = value), not string interpolation. Flag patterns like info!(\"processing {}\", item) - should be info!(item = %item, \"processing\")."
      severity: error
      files: "*.rs"

    - name: log-level-semantics
      description: "Log levels must match semantics: error = failures that stop operation, warn = recoverable issues, info = major operations (LLM calls, chunking), debug = internal state, trace = verbose diagnostics. Flag error! with fallback behavior or info! for internal details."
      severity: warning
      files: "*.rs"

    - name: stderr-for-user-warnings
      description: "User-facing warnings (that should be visible without RUST_LOG) must use eprintln!(), not tracing. This preserves stdout for JSON output piping."
      severity: warning
      files: "*.rs"

  style:
    - name: why-not-what-comments
      description: "Flag inline comments (//) that merely restate obvious code behavior. ONLY applies to inline comments within function bodies. Do NOT flag: (1) doc comments (/// or //!) - these are API documentation and should exist on public items, (2) comments explaining non-obvious logic or 'why' reasoning, (3) comments in #[cfg(test)] modules. If it starts with /// or //!, skip it entirely."
      severity: warning
      files: "*.rs"

    - name: domain-specific-naming
      description: "Prefer descriptive names that match the domain (send_chat_completion over generic run). Common abbreviations like cfg, dir, msg, ctx, cmd are OK; avoid obscure ones."
      severity: info
      files: "*.rs"

  visibility:
    - name: private-first
      description: "Helper functions only called within the same file should not be pub or pub(crate). Flag pub on small utility functions that appear to be internal (e.g., single-use helpers, functions with impl-detail names)."
      severity: warning
      files: "*.rs"

  api-design:
    - name: string-parameter-flexibility
      description: "Functions that store strings should accept `impl Into<String>`, not just `&str`. This allows callers to pass String, &str, or Cow<str> without conversion."
      severity: info
      files: "*.rs"

    - name: default-trait-for-config
      description: "Config structs should implement Default with sensible values. Provide named helper methods for common configurations (e.g., no_retry() for RetryConfig)."
      severity: info
      files: "*.rs"

    - name: avoid-builder-abuse
      description: "Prefer new() with required args + Default trait. Use builder pattern only for structs with many (5+) optional fields. Multiple constructor variants (new, with_api_key, with_http_client) are cleaner for simple cases."
      severity: info
      files: "*.rs"

  async-patterns:
    - name: async-first-io
      description: "File I/O and network operations must be async. Use tokio::fs, not std::fs in async functions. Flag std::fs::read_to_string in async contexts."
      severity: error
      files: "*.rs"

    - name: no-blocking-in-async
      description: "Never use blocking calls in async context: no std::thread::sleep() (use tokio::time::sleep), no .block_on() from async, no reqwest::blocking::Client."
      severity: error
      files: "*.rs"

    - name: bounded-concurrency
      description: "Concurrent operations should be limited via semaphore, buffered(), buffer_unordered(), or concurrency parameter. Flag only truly unbounded patterns like join_all() or FuturesUnordered without limits on user-controlled collections. Do NOT flag code using buffer_unordered(n) or buffered(n) - these are the correct bounded patterns."
      severity: warning
      files: "*.rs"

    - name: async-retry-sleep
      description: "Retry loops must use tokio::time::sleep().await with exponential backoff and jitter, not std::thread::sleep()."
      severity: error
      files: "src/llm/**/*.rs"

  testing:
    - name: deterministic-timing-tests
      description: "Timing assertions (e.g., assert!(elapsed < Duration::from_millis(100))) need 2-3x safety margin. Flag tight timing bounds without explanatory comments."
      severity: warning
      files: "*.rs"

    - name: test-isolation
      description: "Tests doing file I/O should use tempfile::tempdir() or similar, not hardcoded paths. Flag std::fs operations on fixed paths like \"/tmp/test\" or \"./test_output\"."
      severity: error
      files: "*.rs"

  validation:
    - name: explicit-empty-input-errors
      description: "Functions that check .is_empty() should return an error or log a warning, not silently continue. Flag: if input.is_empty() { return Ok(default) } without warning."
      severity: error
      files: "*.rs"

    - name: specific-validation-errors
      description: "Error messages for validation failures must name the specific field or value. Flag generic messages like \"validation failed\" or \"invalid input\" without specifics."
      severity: warning
      files: "*.rs"

  commands:
    - name: output-mode-respect
      description: "Command functions receiving output_mode should use it. Flag println! or eprintln! for data output (not warnings) in functions that have output_mode in scope."
      severity: error
      files: "src/commands/**/*.rs"

    - name: dry-run-check
      description: "Functions with a dry_run parameter should check it before making LLM calls or network requests. Flag run_pipeline() calls without a preceding dry_run check."
      severity: warning
      files: "src/commands/**/*.rs"

  ai-slop:
    - name: hedging-comments
      description: "Flag comments containing uncertain, wishy-washy language characteristic of LLM output: 'should work', 'might need to', 'may need adjustment', 'probably', 'hopefully', 'TODO: consider', 'you may want to'. These indicate the author didn't actually verify the code works. Do NOT flag genuine uncertainty documented for future work (e.g., 'TODO(#123): evaluate X after benchmarking')."
      severity: warning
      files: "*.rs"

    - name: narrating-comments
      description: "Flag tutorial-style numbered step comments that narrate code like a walkthrough: '// Step 1:', '// First, we', '// Next, we', '// Now we', '// Finally, we'. Code should be self-explanatory through structure and naming, not narrated like a blog post. Do NOT flag doc comments (/// or //!) describing API usage steps, or comments in #[cfg(test)] modules."
      severity: warning
      files: "*.rs"

    - name: verbose-match-over-combinators
      description: "Flag match blocks on Option or Result that could be replaced with combinators. Examples: match on Option just to map the inner value (use .map()), match to provide a default (use .unwrap_or() or .unwrap_or_else()), match to chain fallible operations (use .and_then()), match to convert None to an error (use .ok_or() or .ok_or_else()). Verbose match is a strong signal of LLM-generated Rust. Do NOT flag matches with complex logic in arms or matches with more than 2 arms."
      severity: warning
      files: "*.rs"

    - name: gratuitous-clone
      description: "Flag .clone() calls that appear unnecessary: cloning a value immediately before passing it to a function that could accept a reference, cloning a String to pass where &str would work, cloning inside a loop when the value doesn't change between iterations, or multiple .clone() calls on the same variable within a few lines. LLMs sprinkle .clone() to satisfy the borrow checker without understanding ownership. Do NOT flag clones that are clearly needed for shared ownership (Arc, thread spawning) or moves into closures."
      severity: warning
      files: "*.rs"

    - name: tautological-doc-comments
      description: "Flag doc comments (///) that merely restate the function/struct name or signature with no additional insight. Examples: '/// Creates a new Foo' on fn new(), '/// Returns the name' on fn name(), '/// The configuration struct' on struct Config. Doc comments should add value beyond what the signature already communicates: behavior, invariants, panics, errors, or examples. This complements why-not-what-comments which explicitly excludes doc comments."
      severity: warning
      files: "*.rs"

    - name: ai-filler-phrases
      description: "Flag comments and doc comments containing characteristic LLM filler phrases that pad without adding substance: 'Note that', 'It's important to note', 'It's worth mentioning', 'This ensures that' (when the 'what' is obvious), 'for safety' (without explaining what safety concern), 'This is necessary because' (followed by restating the code), 'as expected', 'accordingly', 'robust', 'leverage'. These are statistical artifacts of LLM training, not meaningful documentation."
      severity: info
      files: "*.rs"

    - name: premature-trait-abstraction
      description: "Flag trait definitions that have exactly one implementation in the same file and no obvious reason for the abstraction (e.g., not needed for dynamic dispatch, testing, or public API flexibility). LLMs over-engineer by creating traits where a concrete struct with methods would be simpler. Do NOT flag traits clearly designed for mockability in tests, traits in public API modules, or traits with multiple implementations."
      severity: info
      files: "*.rs"

    - name: redundant-return-binding
      description: "Flag patterns where a value is bound to a variable on one line and immediately returned or used as the sole expression on the next line with no intervening logic: 'let result = some_call(); result' or 'let output = transform(x); Ok(output)'. The intermediate binding adds no clarity - return the expression directly. Do NOT flag bindings used for debugging (preceded by a debug! or dbg!), or bindings that improve readability of very long expressions."
      severity: info
      files: "*.rs"
